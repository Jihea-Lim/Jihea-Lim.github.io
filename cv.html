<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>CV - Your Name</title>

  <meta name="author" content="Your Name">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CV of Your Name">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="CV - Your Name">
  <meta property="og:description" content="Curriculum Vitae of Your Name">
  <meta property="og:image" content="https://yourwebsite.com/figures/me.jpg">
  <meta property="og:url" content="https://yourwebsite.com/cv.html">
  <meta property="og:type" content="profile">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="CV - Your Name">
  <meta name="twitter:description" content="Curriculum Vitae of Your Name">
  <meta name="twitter:image" content="https://yourwebsite.com/figures/me.jpg">

  <!-- Styles -->
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="stylesheet" type="text/css" href="shared-styles.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="figures/logo.png">

  <style>
    .about-page h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 28px;
    }

    .cv-pdf-link {
      font-size: 14px;
      font-weight: 400;
      margin-left: 8px;
      vertical-align: middle;
    }

    .cv-contact {
      margin: -12px 0 24px;
      font-size: 14px;
      color: #374151;
    }

    .cv-contact a {
      color: var(--primary-color);
    }

    .cv-contact .sep {
      color: #9ca3af;
      margin: 0 8px;
    }

    .about-section {
      margin-bottom: 24px;
    }

    .about-section h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #e5e7eb;
    }

    .about-section ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .about-section li {
      margin-bottom: 4px;
      padding: 0;
      color: #374151;
      line-height: 1.6;
    }

    /* Dark mode */
    [data-theme="dark"] .about-page h1 {
      color: var(--text-color);
    }

    [data-theme="dark"] .cv-contact {
      color: var(--text-color);
    }

    [data-theme="dark"] .cv-contact .sep {
      color: #888;
    }

    [data-theme="dark"] .about-section h2 {
      color: var(--text-color);
      border-bottom-color: #374151;
    }

    [data-theme="dark"] .about-section li {
      color: var(--text-color);
    }
  </style>

</head>

<body>

  <!-- Navigation -->
  <div id="site-nav"></div>

  <main id="main-content" class="about-page page-shell">

    <!-- CV -->
    <h1>
      CV
      <a href="files/CV.pdf"
         class="cv-pdf-link"
         target="_blank"
         rel="noopener">[PDF]</a>
    </h1>

    <!-- Contact -->
    <div class="cv-contact">

      <a href="mailto:your.email@institution.edu">
        your.email@institution.edu
      </a>

      <span class="sep">/</span>

      <a href="https://github.com/yourusername"
         target="_blank"
         rel="noopener">
        GitHub
      </a>

      <span class="sep">/</span>

      <a href="https://scholar.google.com/citations?user=YOURID"
         target="_blank"
         rel="noopener">
        Google Scholar
      </a>

      <span class="sep">/</span>

      <a href="https://www.linkedin.com/in/yourprofile"
         target="_blank"
         rel="noopener">
        LinkedIn
      </a>

      <span class="sep">/</span>

      <a href="https://x.com/yourusername"
         target="_blank"
         rel="noopener">
        Twitter
      </a>

    </div>

    <!-- Education -->
    <div class="about-section">

      <h2>Education</h2>

      <ul>
        <li>
          Ph.D. in Your Field,
          <a href="https://yourinstitution.edu/">
            Your Institution
          </a>,
          YYYY &ndash; Present
        </li>

        <li>
          BEng in Your Field,
          <a href="https://yourinstitution.edu/">
            Your Institution
          </a>,
          YYYY &ndash; YYYY
        </li>
      </ul>

    </div>

  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="site-shell.js"></script>
  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>

</body>

</html>
